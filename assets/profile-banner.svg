<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Nayum Ahmed portfolio banner</title>
<desc id="desc">A midnight blue, electric blue, and cyan abstract portfolio banner with glowing orbital rings and a developer label.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".48" stop-color="#102b62"/><stop offset="1" stop-color="#075985"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".32"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bfdbfe" stroke-opacity=".08" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<rect width="1200" height="360" rx="28" fill="url(#grid)"/>
<circle cx="990" cy="180" r="220" fill="url(#glow)" filter="url(#blur)"/>
<g fill="none" stroke="url(#line)" stroke-width="2" opacity=".65">
  <ellipse cx="990" cy="180" rx="170" ry="78" transform="rotate(-32 990 180)"/>
  <ellipse cx="990" cy="180" rx="170" ry="78" transform="rotate(32 990 180)"/>
  <ellipse cx="990" cy="180" rx="125" ry="125" transform="rotate(12 990 180)" stroke-opacity=".5"/>
</g>
<g fill="#67e8f9"><circle cx="1090" cy="96" r="5"/><circle cx="858" cy="220" r="4"/><circle cx="1038" cy="277" r="3"/><circle cx="930" cy="80" r="3"/></g>
<path d="M70 76h42M91 55v42" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" opacity=".9"/>
<text x="72" y="155" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="5">PERSONAL PROJECT PORTFOLIO</text>
<text x="68" y="220" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">Nayum Ahmed</text>
<text x="72" y="264" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">Explore ideas. Build useful things. Keep learning.</text>
<rect x="72" y="300" width="8" height="8" rx="4" fill="#67e8f9"/><text x="92" y="309" fill="#bae6fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">OPEN SOURCE • EXPERIMENTS • LEARNING</text>
</svg>