<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Nayum Ahmed — animated developer portfolio</title>
<desc id="desc">A polished midnight-blue and cyan portfolio banner with subtle animated orbital rings, moving light, and pulsing stars.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset=".48" stop-color="#102b62"/><stop offset="1" stop-color="#075985"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#60a5fa"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#c4b5fd"/>
    <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset=".5" stop-color="#a5f3fc" stop-opacity=".7"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".32"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bfdbfe" stroke-opacity=".08" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <clipPath id="clip"><rect width="1200" height="360" rx="28"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <circle cx="990" cy="180" r="220" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="r" values="190;235;190" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;1;.55" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="url(#line)" stroke-width="2" opacity=".72">
    <ellipse cx="990" cy="180" rx="170" ry="78" transform="rotate(-32 990 180)">
      <animateTransform attributeName="transform" type="rotate" from="-32 990 180" to="328 990 180" dur="32s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="990" cy="180" rx="170" ry="78" transform="rotate(32 990 180)" stroke-opacity=".8">
      <animateTransform attributeName="transform" type="rotate" from="32 990 180" to="-328 990 180" dur="38s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="990" cy="180" rx="125" ry="125" transform="rotate(12 990 180)" stroke-opacity=".5">
      <animateTransform attributeName="transform" type="rotate" from="12 990 180" to="372 990 180" dur="45s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <path d="M760 0 L900 0 L620 360 L480 360 Z" fill="url(#sweep)" opacity=".22">
    <animateTransform attributeName="transform" type="translate" values="-500 0;900 0;-500 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <g fill="#67e8f9">
    <circle cx="1090" cy="96" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="858" cy="220" r="4"><animate attributeName="r" values="3;5;3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1038" cy="277" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="80" r="3"><animate attributeName="r" values="2;4;2" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M70 76h42M91 55v42" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <text x="72" y="155" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="5">PERSONAL PROJECT PORTFOLIO</text>
  <text x="68" y="220" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">Nayum Ahmed</text>
  <text x="72" y="264" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">Explore ideas. Build useful things. Keep learning.</text>
  <rect x="72" y="300" width="8" height="8" rx="4" fill="#67e8f9"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></rect>
  <text x="92" y="309" fill="#bae6fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">OPEN SOURCE • EXPERIMENTS • LEARNING</text>
</g>
</svg>