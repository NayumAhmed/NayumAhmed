<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Nayum Ahmed — animated developer portfolio</title>
<desc id="desc">A polished midnight-blue and cyan portfolio banner with subtle animated orbital rings, moving light, and pulsing stars.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111f"/><stop offset=".48" stop-color="#102b62"/><stop offset="1" stop-color="#075985"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#60a5fa"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#c4b5fd"/>
    <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset=".5" stop-color="#a5f3fc" stop-opacity=".7"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".32"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bfdbfe" stroke-opacity=".08" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  
</defs>
<g>
  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <circle cx="990" cy="180" r="220" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="r" values="190;235;190" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;1;.55" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="url(#line)" stroke-width="2" opacity=".72">
    <ellipse cx="990" cy="180" rx="170" ry="78" transform="rotate(-32 990 180)">
      <animateTransform attributeName="transform" type="rotate" from="-32 990 180" to="328 990 180" dur="32s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="990" cy="180" rx="170" ry="78" transform="rotate(32 990 180)" stroke-opacity=".8">
      <animateTransform attributeName="transform" type="rotate" from="32 990 180" to="-328 990 180" dur="38s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="990" cy="180" rx="125" ry="125" transform="rotate(12 990 180)" stroke-opacity=".5">
      <animateTransform attributeName="transform" type="rotate" from="12 990 180" to="372 990 180" dur="45s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <path d="M760 0 L900 0 L620 360 L480 360 Z" fill="url(#sweep)" opacity=".22">
    <animateTransform attributeName="transform" type="translate" values="-500 0;900 0;-500 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <!-- Animated particle accelerator: electrons orbit, particles collide, energy flashes. -->
  <g id="particle-accelerator">
    <circle cx="990" cy="180" r="104" fill="#07111f" fill-opacity=".28" stroke="#67e8f9" stroke-opacity=".18" stroke-width="1.5"/>
    <circle cx="990" cy="180" r="64" fill="url(#glow)" opacity=".9">
      <animate attributeName="r" values="48;76;48" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".25;.9;.25" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Glowing nucleus with protons and neutrons -->
    <g>
      <circle cx="978" cy="170" r="14" fill="#fb7185" stroke="#fecdd3" stroke-width="2"/>
      <circle cx="1001" cy="169" r="14" fill="#38bdf8" stroke="#bae6fd" stroke-width="2"/>
      <circle cx="986" cy="191" r="14" fill="#f97316" stroke="#fed7aa" stroke-width="2"/>
      <circle cx="1007" cy="192" r="13" fill="#a78bfa" stroke="#ddd6fe" stroke-width="2"/>
      <circle cx="978" cy="170" r="4" fill="#fff"/>
      <circle cx="1001" cy="169" r="4" fill="#fff"/>
      <circle cx="986" cy="191" r="4" fill="#fff"/>
      <circle cx="1007" cy="192" r="4" fill="#fff"/>
      <animateTransform attributeName="transform" type="rotate" values="0 993 181;360 993 181" dur="18s" repeatCount="indefinite"/>
    </g>
    <!-- Electrons travel around the nucleus on three tilted paths. -->
    <g fill="none" stroke="#67e8f9" stroke-opacity=".7" stroke-width="1.8">
      <ellipse cx="993" cy="181" rx="128" ry="48" transform="rotate(-28 993 181)"/>
      <ellipse cx="993" cy="181" rx="128" ry="48" transform="rotate(48 993 181)" stroke="#c4b5fd"/>
      <ellipse cx="993" cy="181" rx="128" ry="48" transform="rotate(90 993 181)" stroke="#38bdf8" stroke-opacity=".48"/>
    </g>
    <g>
      <circle r="8" fill="#67e8f9" stroke="#ecfeff" stroke-width="2" filter="url(#blur)">
        <animateMotion dur="4.4s" repeatCount="indefinite" path="M865 181 A128 48 -28 1 0 1121 181 A128 48 -28 1 0 865 181"/>
      </circle>
      <circle r="6" fill="#22d3ee" stroke="#ecfeff" stroke-width="1.5">
        <animateMotion dur="3.6s" repeatCount="indefinite" path="M993 53 A128 48 48 1 0 993 309 A128 48 48 1 0 993 53"/>
      </circle>
      <circle r="6" fill="#c4b5fd" stroke="#fff" stroke-width="1.5">
        <animateMotion dur="5.1s" repeatCount="indefinite" path="M993 53 A128 48 90 1 0 993 309 A128 48 90 1 0 993 53"/>
      </circle>
    </g>
    <!-- Particle collision flash, expanding shock ring and thunder-like energy arcs. -->
    <g transform="translate(993 181)">
      <circle r="18" fill="#fff" opacity="0">
        <animate attributeName="r" values="8;64;8" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.72;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="22" fill="none" stroke="#67e8f9" stroke-width="3" opacity="0">
        <animate attributeName="r" values="12;94;12" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.85;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M-10 -30 L4 -8 L-5 3 L16 17 L5 2 L13 -10 Z" fill="#fff" stroke="#67e8f9" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.12;.42;1" dur="3.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="scale" values=".5;.5;1.5;.5" dur="3.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
      <path d="M870 104 L886 122 L876 135 L901 151 L891 131 L904 118" stroke="#67e8f9" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.15;.4;1" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M1080 224 L1065 242 L1078 253 L1051 270 L1062 248 L1050 236" stroke="#c4b5fd" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.4;.55;1" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M1090 112 L1102 126 L1093 137 L1114 150" stroke="#f0abfc" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.2;.38;1" dur="2.7s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#e0f2fe">
      <circle cx="893" cy="151" r="3"><animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1082" cy="217" r="4"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="1044" cy="106" r="3"><animate attributeName="r" values="2;5;2" dur="2.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <g fill="#67e8f9">
    <circle cx="1090" cy="96" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="858" cy="220" r="4"><animate attributeName="r" values="3;5;3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1038" cy="277" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="80" r="3"><animate attributeName="r" values="2;4;2" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M70 76h42M91 55v42" stroke="#67e8f9" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <text x="72" y="155" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="5">PERSONAL PROJECT PORTFOLIO</text>
  <!-- Thunder and lightning behind the name: brief flashes, never permanently obscuring the text. -->
  <defs>
    <filter id="name-lightning-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blurred"/>
      <feMerge><feMergeNode in="blurred"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="name-flash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".45" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <g id="name-thunder" fill="none" stroke="url(#name-flash)" stroke-linejoin="round" stroke-linecap="round" filter="url(#name-lightning-glow)">
    <path d="M240 166 L258 184 L246 198 L270 210 L258 225 L278 239" stroke-width="3.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;.1;0;0" keyTimes="0;.18;.2;.24;.29;1" dur="4.6s" repeatCount="indefinite"/>
    </path>
    <path d="M462 174 L448 192 L462 202 L444 218 L455 230" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;1;.15;0;0" keyTimes="0;.48;.5;.54;.6;1" dur="4.6s" repeatCount="indefinite"/>
    </path>
    <path d="M300 176 L314 188 L306 198" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.1;.18;1" dur="5.3s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x="65" y="177" width="540" height="58" rx="12" fill="#67e8f9" opacity="0">
    <animate attributeName="opacity" values="0;0;.13;0;0" keyTimes="0;.18;.2;.23;1" dur="4.6s" repeatCount="indefinite"/>
  </rect>
  <text x="68" y="220" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-1.5">Nayum Ahmed</text>
  <text x="72" y="264" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">Explore ideas. Build useful things. Keep learning.</text>
  <rect x="72" y="300" width="8" height="8" rx="4" fill="#67e8f9"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></rect>
  <text x="92" y="309" fill="#bae6fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">OPEN SOURCE • EXPERIMENTS • LEARNING</text>
</g>
</svg>